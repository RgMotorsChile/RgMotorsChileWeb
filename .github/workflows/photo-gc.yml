# El catalogo y sus fotos ya no se limpian en automatico.
# El panel sigue creando, editando y borrando vehiculos a mano.
name: Fotos huerfanas

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Solo listar (el job ya no llama al API)
        required: false
        type: boolean
        default: true

jobs:
  photo-gc:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Automatizacion desactivada
        run: |
          echo "El borrado automatico de fotos huerfanas esta desactivado."
          echo "Este job ya no llama a /api/cron/photo-gc."
