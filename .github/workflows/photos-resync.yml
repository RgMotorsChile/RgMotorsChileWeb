# Re-sync automatico de fotos desactivado: las fotos se gestionan en el panel.
name: Re-sync fotos

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Ya no se usa; el job no llama al API
        required: false
        default: "4"
        type: string

jobs:
  photos-resync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Automatizacion desactivada
        run: |
          echo "El re-sync automatico de fotos esta desactivado."
          echo "Este job ya no llama a /api/cron/photos-resync."
