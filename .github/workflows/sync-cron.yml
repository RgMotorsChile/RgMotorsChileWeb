# El catalogo solo se administra desde el panel.
# Los horarios que llamaban a /api/cron/sync (RG y Unidades Chile) quedaron fuera.
name: Sync inventario

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant (ya no se sincroniza; el job no llama al API)
        required: false
        type: choice
        options:
          - rg-motors
          - unidades-chile

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Automatizacion desactivada
        run: |
          echo "El catalogo solo se administra desde el panel."
          echo "Este job ya no llama a /api/cron/sync."
