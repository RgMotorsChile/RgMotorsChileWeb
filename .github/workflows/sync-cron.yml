# Vercel queda solo como hosting: estos horarios reemplazan los crons de vercel.json.
# Cada schedule elige un tenant. El endpoint resuelve el tenant por query, no por host.
name: Sync inventario

on:
  schedule:
    # UTC. Minutos 5 y 35 → RG Motors.
    - cron: "5,35 * * * *"
    # UTC. Minutos 20 y 50 → Unidades Chile.
    - cron: "20,50 * * * *"
    # Los tres horarios que antes estaban en vercel.json.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant a sincronizar
        required: true
        type: choice
        options:
          - rg-motors
          - unidades-chile

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Elegir tenant y disparar el sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TENANT: ${{ inputs.tenant }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Falta el secret CRON_SECRET en GitHub Actions." >&2
            echo "Crearlo en Settings → Secrets and variables → Actions con el mismo valor que CRON_SECRET en Vercel." >&2
            exit 1
          fi

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tenant="${INPUT_TENANT}"
          else
            case "${EVENT_SCHEDULE}" in
              "5,35 * * * *") tenant="rg-motors" ;;
              "20,50 * * * *") tenant="unidades-chile" ;;
              "0 11 * * *") tenant="rg-motors" ;;
              "0 12 * * *") tenant="unidades-chile" ;;
              "0 22 * * *") tenant="rg-motors" ;;
              *)
                echo "Schedule no reconocido: ${EVENT_SCHEDULE}" >&2
                exit 1
                ;;
            esac
          fi

          case "${tenant}" in
            rg-motors|unidades-chile) ;;
            *)
              echo "Tenant inválido: ${tenant}" >&2
              exit 1
              ;;
          esac

          # Mismo deployment. resolveCronTenant() usa ?tenant=, no el host.
          # El apex responde 301 a www y esa redirección descarta Authorization.
          # Sin --location: un 301 no es 2xx y el job falla.
          url="https://www.rgmotorschile.cl/api/cron/sync?tenant=${tenant}"
          echo "GET ${url}"

          # Los logs de este workflow son públicos. Solo conteos, success y
          # errores en texto. Nunca el JSON ni fichas (proveedor, precio lista,
          # portada, patente), tampoco si curl o el HTTP fallan.
          summarize_sync_body() {
            local file="$1"
            if [ ! -s "${file}" ]; then
              echo "Sin cuerpo de respuesta."
              return 0
            fi
            if ! jq -e 'type == "object"' "${file}" >/dev/null 2>&1; then
              echo "La respuesta no es un objeto JSON. No se imprime el cuerpo."
              return 0
            fi
            jq -r '
              def num($v): $v | if type == "number" then . else 0 end;
              def msgs:
                [ (.errors // .syncState.errors // [])[]?, (.error // empty) ]
                | map(select(type == "string" and length > 0))
                | map(select(test("^[[:space:]]*[{\\[]") | not))
                | unique
                | .[];
              "success=\(if .success == true then "true" else "false" end) leidos=\(num(.read // .syncState.read)) insertados=\(num(.inserted // .syncState.inserted)) actualizados=\(num(.updated // .syncState.updated)) vendidos=\(num(.sold // .sheetSync.soldVehicles)) omitidos=\(num(.skipped // .syncState.skipped))",
              (msgs | "error: \(if length > 300 then .[0:300] else . end)")
            ' "${file}" | sed -E 's/\b([A-Za-z]{4}[[:space:]]?[0-9]{2}|[A-Za-z]{2}[[:space:]]?[0-9]{4})\b/[patente]/g'
          }

          set +e
          http_code=$(curl --silent --show-error --max-time 75 \
            -o /tmp/sync-body.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${url}")
          curl_status=$?
          set -e

          if [ "${curl_status}" -ne 0 ]; then
            echo "curl falló (exit ${curl_status})" >&2
            summarize_sync_body /tmp/sync-body.json >&2
            exit 1
          fi

          echo "HTTP ${http_code}"
          summarize_sync_body /tmp/sync-body.json
          echo
          case "${http_code}" in
            2*) exit 0 ;;
            *)
              echo "El sync respondió ${http_code}, se esperaba 2xx." >&2
              exit 1
              ;;
          esac
